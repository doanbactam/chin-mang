[package]
name = "chin-mang"
version.workspace = true
edition.workspace = true

[features]
default = []
# Bảng debug (bevy_egui chỉ được phép sau feature này; bản phát hành không bật).
debug = []

[dependencies]
cm-core.workspace = true
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
# Khai báo trực tiếp (không qua workspace) để tắt default-features: chỉ bật phần 2D + UI + audio cần dùng.
bevy = { version = "0.20.1", default-features = false, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_log",
    "bevy_winit",
    "bevy_window",
    "x11",
    "wayland",
    "webgl2",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_camera",
    "bevy_color",
    "bevy_image",
    "png",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_ui_widgets",
    "bevy_input_focus",
    "bevy_picking",
    "ui_picking",
    "mouse",
    "keyboard",
    "bevy_audio",
    "wav",
    "vorbis",
    "bevy_clipboard",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["web"] }
wasm-bindgen = "=0.2.130"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Storage", "Location", "UrlSearchParams", "Document", "HtmlCanvasElement"] }

[target.'cfg(windows)'.dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["system_clipboard"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_Globalization",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Nạp libwayland-client lúc chạy (dlopen) thay vì link cứng: build được trên máy không có header Wayland.
winit = { version = "0.30", default-features = false, features = ["wayland-dlopen"] }

[dev-dependencies]
ttf-parser = "0.25"
