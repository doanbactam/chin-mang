[workspace]
resolver = "3"
members = ["crates/core", "crates/game", "crates/bot"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
cm-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bevy = "0.20.1"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
[profile.wasm-release]
inherits = "release"
opt-level = "z"
