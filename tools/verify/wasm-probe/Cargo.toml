# Probe độc lập: chứng minh pipeline Bevy 0.20.1 → wasm32 → wasm-bindgen → Chromium headless (WebGL2/SwiftShader) → PNG.
# Không thuộc workspace chính (bảng [workspace] rỗng). Build: node tools/verify/wasm-probe/run.mjs
[package]
name = "cm-probe"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
# Cùng tập feature khuyến nghị cho crates/game (xem docs/DECISIONS.md): 2D + UI + audio, không 3D/PBR.
bevy = { version = "0.20.1", default-features = false, features = ["2d", "ui", "audio", "wav", "png"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["web", "webgl2"] }
js-sys = "0.3"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 16
strip = "debuginfo"
